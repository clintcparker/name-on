name: Verify Install URLs

# Every install URL this project advertises must serve a real installer. The URLs
# are DERIVED from the CLI help output and the README rather than hard-coded here,
# so adding or changing an advertised URL automatically changes what gets checked.
#
# Not triggered on `push: main` — that would race the site deploy. This runs after
# the deploy workflow finishes, plus daily, plus on demand.
#
# `workflow_run` fires on EVERY completion of the deploy workflow, including its
# `pull_request` runs — which build a preview and deploy nothing to production. The
# PR-close run finishes seconds after a merge, well before the real main deploy, so
# without the job gate below every merge produced one spurious failure against a
# site that had not been updated yet. Observed on the 002 merge: the PR-close run
# finished 01:11:55 and triggered a verify at 01:11:56, while the main deploy ran
# until 01:13:02.

on:
  workflow_run:
    workflows: ["Azure Static Web Apps CI/CD"]
    types: [completed]
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    name: Every advertised install URL serves an installer
    # Only a successful push-to-main deploy means production actually changed.
    if: >-
      github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Derive the advertised install URLs
        # Matches ANY advertised https URL ending in .sh or .ps1 — deliberately not
        # `install\.(sh|ps1)`. That narrower pattern only saw those two exact
        # filenames, so an advertised URL renamed to `install-typo.sh` or
        # `setup.sh` was never derived and therefore never checked: the surface
        # FR-009 is supposed to protect had a hole in it. Verified by advertising
        # `/install-typo.sh` and watching the old pattern skip it entirely.
        run: |
          set -euo pipefail
          {
            dotnet run --project name-on-cli -- --help
            cat README.md
          # `|| true` so a no-match grep (exit 1) does not trip `set -e` here — that
          # killed the step before the diagnostic below could run, turning a
          # broken-scraper failure into an opaque one. The guard is the error path.
          } | grep -oE 'https://[^ |'"'"'")]*\.(sh|ps1)' | sort -u > advertised-urls.txt || true

          echo "Advertised install URLs:"
          cat advertised-urls.txt

          if [ ! -s advertised-urls.txt ]; then
            echo "::error::No install URLs found. The scraping pattern no longer matches the help output or README."
            exit 1
          fi

      - name: Every advertised URL serves a readable installer
        run: |
          set -uo pipefail
          failed=0

          while read -r url; do
            echo "--- $url"
            bad=0

            # One request supplies both the status and the content type, so the
            # headers always describe the body that was actually checked.
            read -r code ctype <<<"$(curl -sSL -o body.tmp -w '%{http_code} %{content_type}' "$url" || echo '000 -')"

            if [ "$code" != "200" ]; then
              echo "::error::$url returned HTTP $code (expected 200)"
              failed=1
              continue
            fi

            case "$ctype" in
              text/*) ;;
              *)
                echo "::error::$url served Content-Type '$ctype' (expected text/*) — it would download instead of rendering"
                bad=1
                ;;
            esac

            if grep -qi '<!DOCTYPE' body.tmp; then
              echo "::error::$url served HTML, not an installer — a route fallback is probably intercepting the path"
              bad=1
            fi

            if ! grep -q 'clintcparker/name-on' body.tmp; then
              echo "::error::$url body does not reference clintcparker/name-on — not this project's installer"
              bad=1
            fi

            if ! grep -q 'name-on CLI installer' body.tmp; then
              echo "::error::$url body has no 'name-on CLI installer' header line"
              bad=1
            fi

            if [ "$bad" -eq 0 ]; then
              echo "ok: HTTP 200, $ctype, installer body confirmed"
            else
              failed=1
            fi
          done < advertised-urls.txt

          exit "$failed"

      - name: The deployed site serves the canonical installers byte-for-byte
        run: |
          set -uo pipefail
          failed=0

          for script in install.sh install.ps1; do
            url="https://name-on.clintcparker.com/$script"
            echo "--- $url vs install/$script"
            if ! curl -fsSL "$url" | diff "install/$script" -; then
              echo "::error::$url is not byte-identical to install/$script"
              failed=1
            else
              echo "ok: byte-identical"
            fi
          done

          exit "$failed"

      - name: Path variants never serve the app's HTML as success
        # The hazard this guards against is a route fallback answering a typo'd
        # path with 200 + the SPA's HTML: piping that to a shell runs HTML as a
        # script. A 404 is the honest answer, and so is the host normalising a
        # path onto the real installer — Azure Static Web Apps 301s `/install.sh/`
        # to `/install.sh` because that file now exists (it does the same for
        # `/index.html/`). Redirects are followed, so what gets asserted is the
        # response a piped `curl -fsSL` would actually execute.
        run: |
          set -uo pipefail
          failed=0

          for path in /Install.sh /install.sh/ /install.txt /does-not-exist-xyz; do
            url="https://name-on.clintcparker.com$path"
            code=$(curl -sL -o body.tmp -w '%{http_code}' "$url" || echo "000")

            if [ "$code" = "404" ]; then
              echo "ok: $path -> 404"
            elif grep -q 'name-on CLI installer' body.tmp && ! grep -qi '<!DOCTYPE' body.tmp; then
              echo "ok: $path -> HTTP $code, normalised to the real installer"
            elif grep -qi '<!DOCTYPE' body.tmp; then
              echo "::error::$path returned HTTP $code carrying the app's HTML — a route fallback is intercepting it, and a piped install of this typo would run HTML as a shell script"
              failed=1
            else
              echo "::error::$path returned HTTP $code serving neither a 404 nor a recognisable installer"
              failed=1
            fi
          done

          exit "$failed"
